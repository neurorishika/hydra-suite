# Conda supplies ONLY what pip cannot: the interpreter, the ffmpeg binary and
# the toolchain for the AprilTag C-extension build. Every Python package is
# declared in pyproject.toml and installed by install.py.
#
# Preferred:   python install.py            (creates this env for you)
# Manual:      mamba env create -f environment.yml && conda activate hydra && make install...
#
# Keep in sync with CONDA_PACKAGES in install.py (tests/test_installer.py).
name: hydra
channels:
- conda-forge
dependencies:
- python=3.13
- pip
- ffmpeg
- git
- cmake
- c-compiler
- cxx-compiler
