name: Docs (GitHub Pages)

on:
  push:
    branches:
    - "**"
  workflow_dispatch:
    inputs:
      deploy_as:
        description: "Version label to deploy (latest or nightly)"
        required: false
        default: "nightly"

# mike pushes directly to the gh-pages branch, so contents: write is required.
permissions:
  contents: write

# Use per-ref concurrency so main and nightly deployments don't block each other,
# but rapid successive pushes to the same branch cancel the older run.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          # mike needs the full history to manage the gh-pages branch
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        # Only the [docs] extra (pyproject.toml is the single source of truth);
        # mkdocstrings reads source statically, so the heavy runtime deps are
        # not needed to build the site.
        python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['docs']))" > /tmp/docs-reqs.txt
        pip install -r /tmp/docs-reqs.txt

    - name: Configure Git identity for mike
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Deploy stable docs (main branch → "latest")
      if: github.ref_name == 'main'
      run: |
        mike deploy --push --update-aliases latest "Latest"
        mike set-default --push latest

    - name: Deploy nightly docs (non-main branch → "nightly")
      if: github.ref_name != 'main'
      run: |
        # Override strict mode: mike passes args to mkdocs build internally,
        # but we can supply a non-strict mkdocs config via an override file.
        sed 's/^strict: true/strict: false/' mkdocs.yml > mkdocs-nightly.yml
        mike deploy --push --config-file mkdocs-nightly.yml nightly "Nightly"
        rm -f mkdocs-nightly.yml
        # If no default version has been set yet (e.g. main has never been deployed),
        # point the root URL at nightly so the site isn't a 404.
        mike list 2>/dev/null | grep -q '\[default\]' || mike set-default --push nightly
