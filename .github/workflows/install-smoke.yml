name: Install smoke

# Proves install.py builds a working environment on every OS x Python we
# support, with no GPU (--cuda none). GPU tiers are verified manually on the
# CUDA boxes; see docs/getting-started/installation.md#verify.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: System libraries for headless Qt (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
          libfontconfig1 libxcb-cursor0

    - name: Installer dry run
      run: python install.py --target current --cuda none --dev --dry-run

    # macOS runners are Apple Silicon VMs without a usable Metal device, so the
    # mps tier's packages are installed but doctor is pointed at the cpu checks.
    - name: Install (mps packages)
      if: runner.os == 'macOS'
      run: python install.py --target current --tier mps --dev --skip-doctor

    - name: Install (cpu)
      if: runner.os != 'macOS'
      run: python install.py --target current --cuda none --dev --skip-doctor

    - name: hydra doctor
      run: hydra doctor --tier cpu

    - name: Tests (installer, dependency guard, doctor, core subset)
      run: >
        python -m pytest -p no:cacheprovider -q
        tests/test_installer.py
        tests/test_dependencies_declared.py
        tests/test_doctor.py
        tests/test_cuda_checks.py
        tests/test_min_python_syntax.py
        tests/test_runtime_resolver.py
        tests/test_kalman_filter_manager.py
        tests/test_paths.py

  conda-make:
    # The make wrappers (what most existing users run) on top of conda.
    name: conda + make / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        auto-activate-base: true
        activate-environment: ""

    - name: System libraries for headless Qt (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
          libfontconfig1 libxcb-cursor0

    - name: make setup (creates the conda env via install.py)
      run: make setup

    - name: make install (inside the env)
      run: |
        conda activate hydra
        make install CUDA_MAJOR=
        hydra doctor --tier cpu
