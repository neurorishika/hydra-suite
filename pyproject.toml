# pyproject.toml - Project configuration for hydra-suite (HYDRA)

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-suite"
version = "1.0.0"
description = "HYDRA: Holistic YOLO-based Detection Recognition and Analysis Suite"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Rishika Mohanta", email = "neurorishika@gmail.com"}
]
keywords = ["animal tracking", "computer vision", "behavioral analysis", "opencv", "pose estimation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # pyproject.toml is the ONLY place Python dependencies are declared.
    # install.py picks the torch build (wheel index) and the tier extra;
    # tests/test_dependencies_declared.py fails if src/ imports anything
    # not declared here.
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "numba>=0.58",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pillow>=10.0",
    # The ONE opencv distribution. ultralytics asks for the GUI build
    # (opencv-python); both write cv2/, so install.py overrides it away.
    "opencv-python-headless>=4.8",
    "PySide6>=6.5",
    # torch/torchvision: install.py installs a pinned build from the wheel
    # index matching the tier (cpu / cu128 / cu130) BEFORE this resolves.
    "torch>=2.4",
    # torchvision 0.16.0 (Oct 2023) added the native MPS kernel for roi_align
    # (and roi_pool/ps_roi_align/ps_roi_pool); older installs raise
    # NotImplementedError from rotated_rect_from_masks's roi_align call on the
    # segment-as-OBB path. See torchvision v0.16.0 release notes.
    "torchvision>=0.16.0",
    "timm",
    "tqdm",
    "huggingface_hub",
    # DetectKit's training entrypoint adds an MPS TaskAlignedAssigner
    # compatibility fallback for this PyTorch indexing failure.
    "ultralytics>=8.4.138",
    "hnswlib",
    "usearch",
    "umap-learn",
    "pyyaml",
    # Tracking parameter optimizer (optunahub's AutoSampler uses cmaes).
    "optuna>=3.5",
    "optunahub",
    "cmaes",
    "platformdirs>=3.0",
    # Resource admission, cross-process lease validation, and process-tree
    # watchdogs require portable host/process memory observations.
    "psutil>=5.9",
    "ruptures>=1.1",
    # ffmpeg binary fallback when none is on PATH (venv / Windows installs).
    "imageio-ffmpeg>=0.4.9",
    "av>=12.0",
    # SAM2 geometry escalation (inference) on every tier.
    "sam2>=1.1",
]

[project.optional-dependencies]
# ---- Tier extras: install.py selects exactly one -------------------------
onnx-tools = [
    "onnx",
    "onnxslim",
    "onnxscript",
]
cpu = [
    "hydra-suite[onnx-tools]",
    "onnxruntime>=1.16",
]
mps = [
    "hydra-suite[onnx-tools]",
    "onnxruntime>=1.16",
    "coremltools>=8.0",
]
cuda12 = [
    "hydra-suite[onnx-tools]",
    # onnxruntime-gpu <=1.26 is the last CUDA 12 build. [cuda,cudnn] pulls the
    # nvidia-*-cu12 wheels it links against -- the same family torch+cu128
    # uses -- and runtime/onnx_providers.py calls onnxruntime.preload_dlls(),
    # so no LD_LIBRARY_PATH / conda library hook is needed (Linux or Windows).
    "onnxruntime-gpu[cuda,cudnn]>=1.24,<1.27",
    "cupy-cuda12x",
    "tensorrt-cu12",
    "tensorrt-cu12-bindings",
    "tensorrt-cu12-libs",
    "PyNvVideoCodec",
]
cuda13 = [
    "hydra-suite[onnx-tools]",
    # onnxruntime-gpu >=1.28 is built for CUDA 13 and depends on the same
    # nvidia-* wheel names torch+cu130 uses (unsuffixed cuda-runtime/cufft/...,
    # plus nvidia-cudnn-cu13). 1.27 used -cu13-suffixed CUDA wheels; skip it so
    # two spellings of one library never mix in site-packages/nvidia.
    "onnxruntime-gpu[cuda,cudnn]>=1.28",
    "cupy-cuda13x",
    "tensorrt-cu13",
    "tensorrt-cu13-bindings",
    "tensorrt-cu13-libs",
    "PyNvVideoCodec",
]
cuda = [
    # Alias for cuda12 (works on every driver >= 525).
    "hydra-suite[cuda12]",
]
# ---- Feature extras ------------------------------------------------------
# SAM3 semantic escalation (inference). Installed by default on every tier.
# SAM3 also needs ultralytics' `clip`, which is NOT on PyPI: a PEP 508 direct
# reference (`clip @ git+https://...`) is rejected in uploaded PyPI metadata
# and would break `twine upload` for the WHOLE package. install.py installs it
# from git at a pinned commit.
sam = [
    "ftfy",
    "regex",
]
sam3 = [
    # Back-compat alias.
    "hydra-suite[sam]",
]
# SAM3 LoRA finetuning (training, not inference). Lives in the separate
# hydra-sam3 sidecar env -- build it with `python install.py --with-sam3-train`
# (CUDA only). Never install this extra into the main env: sam3 pins numpy<2.
# Must stay in sync with `TRAINING_PACKAGES` in
# hydra_suite/training/sam3_lora/availability.py.
sam3-train = [
    # Meta's `sam3` itself is not on PyPI (install.py pins a git commit).
    # `iopath` is declared by sam3 but missing when sam3 is used from a
    # source checkout, and fails at import inside sam3.train.loss.
    "torchmetrics",
    "scipy",
    "einops",
    "decord",
    "iopath>=0.1.10",
    # sam3 pins numpy<2; stating it here makes the conflict surface at
    # install time rather than as a runtime ABI error mid-training.
    "numpy>=1.26,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.1",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "pre-commit>=3.7",
    "mypy>=1.9",
    "vulture>=2.11",
    "deadcode>=2.4",
    # dep-graph also needs the graphviz `dot` binary (not pip-installable).
    "pydeps>=1.12",
    "pylint>=3.0",
    "build>=1.0",
    "twine>=5.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.43",
    "mkdocstrings[python]==0.26.2",
    "mkdocs-autorefs==1.2.0",
    "mkdocs-include-markdown-plugin==7.1.4",
    "mike>=2.1.3",
]

[project.urls]
Homepage = "https://github.com/neurorishika/hydra-suite"
Documentation = "https://github.com/neurorishika/hydra-suite/tree/main/docs"
Repository = "https://github.com/neurorishika/hydra-suite"
Issues = "https://github.com/neurorishika/hydra-suite/issues"

[project.scripts]
hydra = "hydra_suite.launcher.cli:main"
trackerkit = "hydra_suite.trackerkit.app:main"
posekit = "hydra_suite.posekit.gui.main:main"
filterkit = "hydra_suite.filterkit.app:main"
classkit = "hydra_suite.classkit.app:main"
refinekit = "hydra_suite.refinekit.app:main"
detectkit = "hydra_suite.detectkit.app:main"

# ============================================================================
# Black - Code formatter
# ============================================================================
[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.pytest_cache
  | __pycache__
  | _build
  | buck-out
  | build
  | dist
  | site
  | legacy
)/
'''

# ============================================================================
# isort - Import sorting
# ============================================================================
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["legacy/*", "site/*", "build/*", "dist/*"]

# ============================================================================
# pytest - Testing framework
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-p", "no:napari",
    "-m", "not benchmark",
    "--tb=short",
]
markers = [
    "benchmark: Performance-oriented tests that are non-gating by default",
    "slow: Tests that take a long time to run",
    "integration: Integration tests",
    "unit: Unit tests",
    "sidecar_e2e: end-to-end sidecar child subprocess runs (slow, needs fixtures)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:\\s*\\*\\*\\* Python is at version 3\\.10 now\\. _PepUnicode_AsString can now be replaced by PyUnicode_AsUTF8! \\*\\*\\*:UserWarning:shibokensupport\\.signature\\.parser",
    "ignore:\\s*\\*\\*\\* Python is at version 3\\.10 now\\. layout\\.py and pyi_generator\\.py can now remove old code! \\*\\*\\*:UserWarning:shibokensupport\\.signature\\.parser",
]

# ============================================================================
# Coverage - Code coverage
# ============================================================================
[tool.coverage.run]
source = ["src/hydra_suite"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "legacy/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ============================================================================
# mypy - Static type checking
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "legacy/",
    "build/",
    "dist/",
    "site/",
]

[[tool.mypy.overrides]]
module = [
    "hydra_suite.classkit.gui.*",
    "hydra_suite.detectkit.gui.*",
    "hydra_suite.filterkit.gui.*",
    "hydra_suite.posekit.gui.*",
    "hydra_suite.refinekit.gui.*",
    "hydra_suite.trackerkit.gui.*",
    "hydra_suite.widgets.*",
    "hydra_suite.utils.file_dialogs",
]
disable_error_code = ["attr-defined", "name-defined"]

# ============================================================================
# deadcode - Dead-code detection
# ============================================================================
[tool.deadcode]
ignore-names = [
    # Dataclass used as a lifecycle profiling contract; consumed dynamically
    "RuntimeMetrics",
    # Convenience properties on SuspicionEvent (dataclass API surface)
    "track_a",
    "track_b",
    # Public/test-only compatibility helpers; deadcode scans src/ but not tests/
    "apply_correction",
    "apply_headtail_rotation",
    "compute_crop_dimensions",
    "detection_cache_hash",
    "extract_and_classify_batch",
    "get_canon_transform",
    "MatMetadataCanonicalizer",
    "matches_frame_range",
    "SwapScorer",
    "SwapSuspicionEvent",
    "tag_detections",
    "remove_images_by_folder",
    "get_detection",
    "get_video_config_path",
    "print_paths",
    "_clear_preview_background_cache",
    "_should_precompute_individual_data",
    "_collapse_obb_axis_theta",
    # Qt/PyTorch/dispatched interfaces
    "apply_config",
    "clear_all",
    "config_changed",
    "forward",
    "paint",
    "paintEvent",
    "set_cv_image",
    "_lr_rows_widget",
    "_on_cnn_identity_model_selected",
    "_on_identity_method_changed",
    "_on_individual_analysis_toggled",
    "_proj",
    "_select_color_tag_model",
    "_ud_rows_widget",
    # Dataclass/config fields retained as API surface or persisted state
    "all_no_tag",
    "DEFAULT_PROJECT_DIR_NAME",
    "DEFAULT_PROJECTS_ROOT_NAME",
    "DEFAULT_SKELETON_DIRNAME",
    "detected_tag_id",
    "heading_rad",
    "last_image_index",
    "MAX_ANALYSIS_IMAGES",
    "min_per_class",
    "n_profiles_run",
    "onnx_model_path",
    "published_models",
    "startup_ms",
    "tensorrt_model_path",
    "training_space",
    "warmup_ms",
    "closed_ms",
    # Exported utility kept for downstream callers
    "extract_metadata_attr",
]

# ============================================================================
# setuptools - Package discovery and data
# ============================================================================
[tool.setuptools.packages.find]
where = ["src"]
exclude = ["brand", "brand.*"]

[tool.setuptools.package-data]
"hydra_suite" = [
    "resources/brand/*.svg",
    "resources/brand/*.png",
    "resources/configs/*.json",
    "resources/configs/skeletons/*.json",
    "py.typed",
]
