[pytest]
testpaths = tests
markers =
    benchmark: performance-oriented tests that are non-gating by default
    slow: long-running tests that are non-gating by default
    coco_eval: full COCO AP runs (~40 min on MPS); non-gating by default
    sidecar_e2e: end-to-end sidecar child subprocess runs (slow, needs fixtures)
addopts = -m "not benchmark and not coco_eval and not slow" -p no:napari --timeout=300 --timeout-method=thread
# --timeout: thread method dumps the stuck test's stack, then os._exit()s the
# process -- under `make pytest` (tools/run_tests_per_file.py) that costs one
# file, not the suite. Neither method can break a native modal loop
# (QDialog::exec); the runner's per-file wall-clock kill is the backstop for
# that. Override per-test with @pytest.mark.timeout(N).
