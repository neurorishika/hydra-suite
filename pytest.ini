[pytest]
testpaths = tests
markers =
    benchmark: performance-oriented tests that are non-gating by default
    slow: long-running tests that are non-gating by default
    coco_eval: full COCO AP runs (~40 min on MPS); non-gating by default
addopts = -m "not benchmark and not coco_eval" -p no:napari --timeout=300 --timeout-method=thread
# --timeout: no single test may hang the whole suite. thread method dumps the
# stuck test's stack for diagnosis; override per-test with @pytest.mark.timeout(N).
