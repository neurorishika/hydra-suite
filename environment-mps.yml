# Conda supplies ONLY what pip cannot: the interpreter and the toolchain for
# the AprilTag C-extension build (ffmpeg comes from the imageio-ffmpeg wheel). Every Python package is
# declared in pyproject.toml and installed by install.py.
#
# Preferred:   python install.py            (creates this env for you)
# Manual:      mamba env create -f environment-mps.yml && conda activate hydra-mps && make install...
#
# Keep in sync with CONDA_PACKAGES in install.py (tests/test_installer.py).
name: hydra-mps
channels:
- conda-forge
dependencies:
- python=3.13
- pip
- git
- cmake
- c-compiler
- cxx-compiler
